name: Preview read-only verification
on:
  push:
    branches: [feat/tarbell-two-volumes-oct2026]
permissions:
  contents: read
  checks: read
concurrency:
  group: tarbell-preview-audit
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/tarbell-two-volumes-oct2026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser test tools (not website dependencies)
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify immutable hosted preview
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify_preview.py
      - name: Retain verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-verification
          path: .audit/
          include-hidden-files: true
          retention-days: 7
