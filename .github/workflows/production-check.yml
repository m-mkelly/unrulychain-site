name: Verify PR 23 live release
on:
  push:
    branches: [verify/pr23-production-20261011]
permissions:
  contents: read
jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ba6c70f0877c6dcdbde262ee13f7b282e9f2511
          persist-credentials: false
      - name: Compare live pages with approved release and check internal navigation
        run: |
          python - <<'PY'
          import concurrent.futures as futures
          import hashlib, json, urllib.request, urllib.parse
          from html.parser import HTMLParser
          from pathlib import Path
          BASE='https://unrulychain.com'
          failures=[]
          class Doc(HTMLParser):
              def __init__(self,text):
                  super().__init__(); self.refs=[]; self.ids=set(); self.feed(text)
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.add(a['id'])
                  if tag=='a' and a.get('href'): self.refs.append(a['href'])
                  if tag in ('img','script') and a.get('src'): self.refs.append(a['src'])
                  if tag=='link' and a.get('rel') in ('stylesheet','icon','shortcut icon','apple-touch-icon','manifest'): self.refs.append(a['href'])
                  if tag=='img' and a.get('srcset'): self.refs.extend(x.strip().split()[0] for x in a['srcset'].split(','))
          def get(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'UnrulyChain-Release-Check','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as r: return {'url':url,'final':r.geturl(),'status':r.status,'type':r.headers.get_content_type(),'body':r.read()}
              except Exception as e: return {'url':url,'status':0,'error':str(e),'body':b'','type':''}
          def route(p):
              s=p.as_posix()
              return '/' if s=='index.html' else '/'+s[:-10] if s.endswith('/index.html') else '/'+s
          pages=sorted(p for p in Path('.').rglob('*.html') if not any(x.startswith('.') or x=='docs' for x in p.parts))
          with futures.ThreadPoolExecutor(max_workers=8) as pool: results=list(pool.map(get,[BASE+route(p) for p in pages]))
          docs={}; references=[]; cache={}
          for p,r in zip(pages,results):
              cache[r['url']]=r
              matched=r['body']==p.read_bytes()
              print(json.dumps({'page':str(p),'status':r['status'],'matchesApprovedRelease':matched}),flush=True)
              if r['status']!=200 or not matched: failures.append('Live page mismatch: '+str(p))
              if r['status']!=200: continue
              d=Doc(r['body'].decode()); docs[r['url']]=d
              for ref in d.refs:
                  url=urllib.parse.urljoin(r['final'],ref); parsed=urllib.parse.urlparse(url)
                  if parsed.scheme in ('http','https') and parsed.netloc=='unrulychain.com': references.append(url)
          urls=sorted(set(urllib.parse.urldefrag(u)[0] for u in references)-set(cache))
          with futures.ThreadPoolExecutor(max_workers=8) as pool:
              for r in pool.map(get,urls): cache[r['url']]=r
          for u,r in cache.items():
              if r['status']!=200: failures.append('Internal resource failed: '+u)
          for u in references:
              target,anchor=urllib.parse.urldefrag(u); r=cache[target]
              if anchor and r['status']==200 and r['type']=='text/html':
                  if urllib.parse.unquote(anchor) not in Doc(r['body'].decode()).ids: failures.append('Missing anchor: '+u)
          for path in ['assets/styles.css','assets/catalog.css','assets/tarbell-pair.css','assets/tarbell-volume.css','assets/amanda-kelly-bw.jpg','assets/tarbell-volume-i-cover-800.jpg','assets/tarbell-volume-ii-cover-800.jpg','assets/prince-cover-800.jpg']:
              r=cache.get(BASE+'/'+path) or get(BASE+'/'+path)
              if r['body']!=Path(path).read_bytes(): failures.append('Live asset mismatch: '+path)
          books=cache[BASE+'/books/']['body'].decode()
          detail=cache[BASE+'/editions/standard-oil/']['body'].decode()
          author=cache[BASE+'/author.html']['body'].decode()
          if books.count('class="tarbell-pair"')!=1: failures.append('Books needs one unified Tarbell entry')
          for slug in ['i','ii']:
              if 'id="volume-'+slug+'"' not in detail: failures.append('Missing separate volume '+slug)
          for text in ['Amanda has a B.A. in Theater Arts from The University of Massachusetts, Boston.','Cabin Pressure','amanda-kelly-bw.jpg']:
              if text not in author: failures.append('Missing approved author content: '+text)
          report={'production':'https://unrulychain.com','releasedCommit':'6ba6c70f0877c6dcdbde262ee13f7b282e9f2511','publicPages':len(pages),'internalRequests':len(cache),'anchorChecks':sum(bool(urllib.parse.urldefrag(u)[1]) for u in set(references)),'allLivePagesMatchApprovedRelease':not failures,'failures':failures}
          print('RELEASE_RESULT '+json.dumps(report),flush=True)
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('```json\n'+json.dumps(report,indent=2)+'\n```\n')
          raise SystemExit(bool(failures))
          PY
